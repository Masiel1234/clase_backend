<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error 404 | UCompensar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }

        .error-container h1 {
            font-size: 100px;
            color: #d32f2f;
            margin-bottom: 10px;
        }

        .error-container h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }

        .error-container p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .btn-volver {
            display: inline-block;
            padding: 12px 25px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-volver:hover {
            background: #0d47a1;
        }
    </style>
</head>

<body>

    <div class="error-container">

        <h1>404</h1>

        <h2>Página no encontrada</h2>

        <p>
            Lo sentimos, el recurso que estás buscando
            no existe o no está disponible.
        </p>

        <a href="/" class="btn-volver">
            Volver al inicio
        </a>

    </div>

</body>

</html>
