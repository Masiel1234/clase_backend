<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - UCompensar</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 24px; color: #1a202c; }
        .btn-cargar {
            background-color: #2563eb; color: white; border: none;
            padding: 10px 18px; border-radius: 6px; font-weight: 500;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-cargar:hover { background-color: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #475569; font-size: 13px; text-transform: uppercase; }
        tr:hover { background-color: #f8fafc; }
        .badge {
            background-color: #e0e7ff; color: #3730a3; padding: 4px 8px;
            border-radius: 4px; font-weight: bold; font-size: 12px;
        }
        .loading, .error { text-align: center; padding: 20px; color: #64748b; }
        .error { color: #dc2626; }
        .bterror-container { margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Base de Datos de Usuarios</h1>
            <!-- Aquí está el botón de cargar que faltaba -->
            <button id="btnCargar" class="btn-cargar">Obtener Datos</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Documento</th>
                    <th>Teléfono</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo">
                <tr>
                    <td colspan="5" class="loading">Haz clic en el botón para cargar la base de datos desde la API.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Aquí dejamos un solo botón de error, sin etiquetas extrañas -->
    <div class="bterror-container">
        <button id="bterror" style="padding: 10px 15px; cursor: pointer; border-radius: 6px;">Probar página de error</button>
    </div>

    <script>
        const btnCargar = document.getElementById('btnCargar');
        const tablaCuerpo = document.getElementById('tablaCuerpo');

        // --- LÓGICA PARA CARGAR LA TABLA ---
        async function cargarUsuarios() {
            tablaCuerpo.innerHTML = '<tr><td colspan="5" class="loading">Cargando datos del servidor...</td></tr>';

            try {
                const respuesta = await fetch('http://localhost:3000/api/v1/productos');
                
                if (!respuesta.ok) {
                    throw new Error(`Error en la solicitud: ${respuesta.status}`);
                }

                const resultado = await respuesta.json();
                const usuarios = resultado.data; 

                tablaCuerpo.innerHTML = '';

                usuarios.forEach(user => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td><span class="badge">#${user.id.trim()}</span></td>
                        <td>${user.Nombre}</td>
                        <td>${user.Apellido}</td>
                        <td>${user.Documento}</td>
                        <td>${user.Numero}</td>
                    `;
                    tablaCuerpo.appendChild(fila);
                });

            } catch (error) {
                console.error("Fallo al consultar la API:", error);
                tablaCuerpo.innerHTML = `
                    <tr>
                        <td colspan="5" class="error">
                            ⚠️ No se pudo conectar con el servidor backend en http://localhost:3000. 
                            Verifica que el comando "node index.js" esté ejecutándose en la terminal.
                        </td>
                    </tr>
                `;
            }
        }

        btnCargar.addEventListener('click', cargarUsuarios);

        // --- LÓGICA PARA EL BOTÓN DE ERROR 404 ---
        const btnError = document.getElementById('bterror');

        btnError.addEventListener('click', async () => {
            try {
                // 1. Intentamos acceder a la ruta que sabemos que da 404
                const respuesta = await fetch('http://localhost:3000/api/v1/status-error');
                
                // 2. Verificamos si el error es exactamente un 404
                if (respuesta.status === 404) {
                    // 3. Mostramos el error en la consola
                    console.error("Error 404: Página o recurso no encontrado.");
                    
                    // 4. Redirigimos a la página visual del error
                    window.location.href = '/pages/pagina-error.html';
                }
            } catch (error) {
                console.error("Fallo de conexión:", error);
            }
        });
    </script>
</body>
</html>
