<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Usuarios - UCompensar</title>
    <link rel="stylesheet" href="../static/style.css" />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Base de Datos de Usuarios</h1>
        <button id="btnCargar" class="btn-cargar">Obtener Datos</button>
      </div>
      <div class="buscar-producto">
        <h2>Buscar producto por ID</h2>
        <input
          type="text"
          id="inputId"
          placeholder="Digite el ID del producto"
        />

        <button id="btnBuscar" class="btn-cargar">Buscar producto</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Documento</th>
            <th>Teléfono</th>
          </tr>
        </thead>

        <tbody id="tablaCuerpo">
          <tr>
            <td colspan="5" class="loading">
              Haz clic en el botón para cargar la base de datos desde la API.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="bterror-container">
      <button
        id="bterror"
        style="padding: 10px 15px; cursor: pointer; border-radius: 6px"
      >
        página de error
      </button>
    </div>
    <script src="../busqueda.js"></script>
  </body>
</html>
